name: Build Lag Switch APK
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure preinstalled Android SDK
        run: |
          SDK="/usr/local/lib/android/sdk"
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android platform, build-tools and NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build real gVisor netstack AAR
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          chmod +x netstack/build-aar.sh
          ./netstack/build-aar.sh
      - name: Run queue tests and build APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LagSwitch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
